name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: ./.github/actions/setup-pnpm
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # These jobs don't gate the release — they warm caches on main so pr.yml's
  # restore-keys and deploy.yml's docker cache-from have something to fall
  # back to. Both only ever have access to the current ref, its base ref (PRs
  # only), or the default branch's cache — a release tag ref has none of
  # those unless main already seeded one.
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: turbo-typecheck-
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-lint-${{ github.sha }}
          restore-keys: turbo-lint-
      - run: pnpm lint

  test-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-test-unit-${{ github.sha }}
          restore-keys: turbo-test-unit-
      - run: pnpm test:unit -- --coverage

  test-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-test-integration-${{ github.sha }}
          restore-keys: turbo-test-integration-
      - run: pnpm test:integration -- --coverage

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-build-${{ github.sha }}
          restore-keys: turbo-build-
      - run: pnpm build

  docker-cache-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  docker-cache-datadog-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker/datadog
          push: false
          cache-from: type=gha,scope=datadog-agent
          cache-to: type=gha,mode=max,scope=datadog-agent
