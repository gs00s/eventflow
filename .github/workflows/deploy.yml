name: Deploy

on:
  release:
    types:
      - published

jobs:
  terraform-apply-and-migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    outputs:
      project_id: ${{ steps.project-id.outputs.project_id }}
      region: ${{ steps.region.outputs.region }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - working-directory: infra
        run: terraform init -input=false
      - working-directory: infra
        run: terraform plan -input=false -out=tfplan
      - working-directory: infra
        run: terraform apply -input=false tfplan
      - working-directory: infra
        run: |
          DB_URL=$(terraform output -raw database_url)
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
      - id: project-id
        working-directory: infra
        run: echo "project_id=$(terraform output -raw gcp_project_id)" >> "$GITHUB_OUTPUT"
      - id: region
        working-directory: infra
        run: echo "region=$(terraform output -raw gcp_region)" >> "$GITHUB_OUTPUT"
      - id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ steps.node-version.outputs.version }}
          cache: true
      - run: pnpm --filter=@eventflow/api db:migrate

  deploy-api:
    needs: terraform-apply-and-migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ needs.terraform-apply-and-migrate.outputs.project_id }}
      GCP_REGION: ${{ needs.terraform-apply-and-migrate.outputs.region }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - id: image
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG="${TAG_NAME#v}"
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/eventflow/api:${TAG}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
      - run: |
          gcloud run deploy api \
            --image="${{ steps.image.outputs.image }}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}"

  deploy-web:
    needs: [deploy-api, terraform-apply-and-migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ needs.terraform-apply-and-migrate.outputs.project_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ steps.node-version.outputs.version }}
          cache: true
      - run: pnpm --filter=@eventflow/web build
      # Pinned: firebase-tools' WIF/ADC auth has open upstream bugs on newer releases (firebase/firebase-tools#10716, #10726) — bump once confirmed fixed.
      - run: npx firebase-tools@15.22.1 deploy --only hosting --non-interactive --project="${GCP_PROJECT_ID}"
