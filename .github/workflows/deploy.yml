name: Deploy

on:
  release:
    types:
      - published

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    outputs:
      database_url: ${{ steps.output.outputs.database_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - run: terraform init -input=false
      - run: terraform plan -input=false -out=tfplan
      - run: terraform apply -input=false tfplan
      - id: output
        run: |
          DB_URL=$(terraform output -raw database_url)
          echo "::add-mask::$DB_URL"
          echo "database_url=$DB_URL" >> "$GITHUB_OUTPUT"

  migrate:
    needs: terraform-apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "::add-mask::${{ needs.terraform-apply.outputs.database_url }}"
      - id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ steps.node-version.outputs.version }}
          cache: true
      - run: pnpm --filter=@eventflow/api db:migrate
        env:
          DATABASE_URL: ${{ needs.terraform-apply.outputs.database_url }}
          BETTER_AUTH_SECRET: ci-migration-only-not-a-real-secret-0000

  build-api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
