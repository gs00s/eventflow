name: Deploy

on:
  release:
    types:
      - published

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    outputs:
      project_id: ${{ steps.project-id.outputs.project_id }}
      region: ${{ steps.region.outputs.region }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - working-directory: infra
        run: terraform init -input=false
      - working-directory: infra
        run: terraform plan -input=false -out=tfplan
      - working-directory: infra
        run: terraform apply -input=false tfplan
      - id: project-id
        working-directory: infra
        run: echo "project_id=$(terraform output -raw gcp_project_id)" >> "$GITHUB_OUTPUT"
      - id: region
        working-directory: infra
        run: echo "region=$(terraform output -raw gcp_region)" >> "$GITHUB_OUTPUT"

  migrate-and-seed:
    needs: terraform-apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ needs.terraform-apply.outputs.project_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          DB_URL=$(gcloud secrets versions access latest --secret=eventflow-api-database-url --project="${GCP_PROJECT_ID}")
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
      - run: |
          AUTH_SECRET=$(gcloud secrets versions access latest --secret=eventflow-api-better-auth-secret --project="${GCP_PROJECT_ID}")
          echo "::add-mask::$AUTH_SECRET"
          echo "BETTER_AUTH_SECRET=$AUTH_SECRET" >> "$GITHUB_ENV"
      - id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ steps.node-version.outputs.version }}
          cache: true
      - run: pnpm --filter=@eventflow/api... build
      - run: pnpm --filter=@eventflow/api... db:migrate
      - run: pnpm --filter=@eventflow/api... db:seed

  deploy-api:
    needs: [migrate-and-seed, terraform-apply]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ needs.terraform-apply.outputs.project_id }}
      GCP_REGION: ${{ needs.terraform-apply.outputs.region }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - id: images
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG="${TAG_NAME#v}"
          echo "api=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/eventflow/api:${TAG}" >> "$GITHUB_OUTPUT"
          echo "datadog-agent=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/eventflow/datadog-agent:${TAG}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.api }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/datadog
          push: true
          tags: ${{ steps.images.outputs.datadog-agent }}
      # One call for both containers: two separate `update` calls would race and clobber each other.
      - run: |
          gcloud run services update api \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}" \
            --container=api \
            --image="${{ steps.images.outputs.api }}" \
            --container=datadog-agent \
            --image="${{ steps.images.outputs.datadog-agent }}"

  deploy-web:
    needs: [migrate-and-seed, terraform-apply]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ needs.terraform-apply.outputs.project_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ steps.node-version.outputs.version }}
          cache: true
      - run: pnpm --filter=@eventflow/web... build
      # Pinned in package.json: firebase-tools' WIF/ADC auth has open upstream bugs on newer releases (firebase/firebase-tools#10716, #10726) — bump once confirmed fixed.
      - run: pnpm exec firebase deploy --only hosting --non-interactive --project="${GCP_PROJECT_ID}"
