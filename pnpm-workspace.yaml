packages:
  - 'apps/*'
  - 'packages/*'

minimumReleaseAge: 1440 # 1 day
blockExoticSubdeps: true

overrides:
  # GHSA-jqff-g426-hqxp and siblings: transitive via @nestjs/cli, firebase-tools, shadcn — none of them pin a patched ajv/fast-uri yet.
  fast-uri: '^3.1.6'
allowBuilds:
  '@swc/core': true
  cpu-features: true
  esbuild: true
  msw: true
  protobufjs: true
  re2: false # only used by firebase-tools' local emulator/regex-rewrite serving, never by `firebase deploy`
  ssh2: true

# Native build scripts are blocked by default; approve per-package via `pnpm approve-builds`
