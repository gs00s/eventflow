packages:
  - 'apps/*'
  - 'packages/*'

minimumReleaseAge: 1440 # 1 day
blockExoticSubdeps: true

overrides:
  # GHSA-jqff-g426-hqxp and siblings: transitive via @nestjs/cli, firebase-tools, shadcn — none of them pin a patched ajv/fast-uri yet.
  fast-uri: '^3.1.6'
  # GHSA-wc9g-mqfw-jrwm and siblings: transitive via @nestjs/platform-express, @thallesp/nestjs-better-auth — not yet on a patched multer.
  multer: '^2.3.0'
  # GHSA-2883-xcg3-v3hh: transitive via semantic-release's cosmiconfig — not yet on a patched js-yaml.
  js-yaml: '^4.3.2'
allowBuilds:
  '@swc/core': true
  cpu-features: true
  esbuild: true
  msw: true
  protobufjs: true
  re2: false # only used by firebase-tools' local emulator/regex-rewrite serving, never by `firebase deploy`
  ssh2: true

# Native build scripts are blocked by default; approve per-package via `pnpm approve-builds`
